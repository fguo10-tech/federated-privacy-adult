name: Benchmark submission
description: Submit results for a new method run on the standard federated benchmark protocol.
title: "[Benchmark] "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to add a method to the benchmark, for example a robust aggregation rule
        from a federated-learning security researcher, an accountant comparison from an industry
        privacy scientist, or an optimiser variant from a distributed-optimisation researcher.

        Submitted numbers are listed as external submissions. They become [Reproduced] in the
        docs only after a maintainer re-runs them from your config.
  - type: dropdown
    id: dataset
    attributes:
      label: Dataset and client split
      options:
        - "UCI Adult, workclass clients and IID control (the standard protocol)"
        - "UCI Adult, workclass clients only"
        - "Synthetic toy domains"
        - "Other (describe below)"
    validations:
      required: true
  - type: input
    id: method
    attributes:
      label: Method name
    validations:
      required: true
  - type: textarea
    id: method_description
    attributes:
      label: Method description
      description: What the method does, a reference if it is published, and a link to your branch or pull request.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit the results were produced from.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
    validations:
      required: true
  - type: input
    id: seeds
    attributes:
      label: Seeds
      description: Reporting seeds, for example 0 1 2 3 4.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results summary
      description: Each metric as mean ± sample std across seeds, next to the baselines run under the same config, data and seeds.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "### Federated details"
  - type: textarea
    id: dataset_details
    attributes:
      label: Dataset or split details
      description: Only if you chose "Other" above or changed the split. Dataset name, version, download location, licence and checksum, and how the clients were built.
  - type: input
    id: aggregation_rule
    attributes:
      label: Aggregation rule
      description: For example sample-weighted FedAvg, Krum, trimmed mean.
    validations:
      required: true
  - type: textarea
    id: threat_model
    attributes:
      label: Threat model
      description: Who is honest, who may be adversarial and how many, what the adversary can see and change. Write "none" for a benign setting.
  - type: dropdown
    id: dp_accountant
    attributes:
      label: DP accountant
      options:
        - RDP
        - PRV
        - GDP
        - Other (describe below)
        - No differential privacy
  - type: input
    id: dp_delta
    attributes:
      label: Delta and epsilon values
      description: The delta used and the epsilon values swept (the standard sweep is epsilon in {1, 3, 8}).
  - type: input
    id: rounds
    attributes:
      label: Rounds and client setup
      description: The standard protocol is 20 rounds with the three workclass clients plus the IID control.
  - type: markdown
    attributes:
      value: "### Protocol"
  - type: checkboxes
    id: protocol
    attributes:
      label: Protocol confirmations
      options:
        - label: Results cover at least 5 seeds, reported as mean ± sample standard deviation across seeds.
          required: true
        - label: The raw per-seed CSVs and the summary CSV are attached.
          required: true
        - label: "`config_used.yaml` and `metadata.json` from every run directory are attached."
          required: true
        - label: Nothing was tuned on the reporting seeds 0–4 or on test data; tuning used seeds 100 and above.
          required: true
        - label: Baselines were run under the same config, data and seeds, and were not modified.
          required: true
        - label: Every number I quote carries a source label ([Paper-reported], [Reproduced] or [Target / TBD]).
          required: true
        - label: No real personal, medical or financial data beyond the public UCI Adult download is attached.
          required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware, wall-clock time and package versions
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: Drag in the CSVs, `config_used.yaml` and `metadata.json`, or link to them.
    validations:
      required: true
